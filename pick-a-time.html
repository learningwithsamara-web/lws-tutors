<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pick a Time — Learning With Samara Tutors</title>
<style>
  :root{
    --navy-deep:#0F0C29; --navy-mid:#1B1547; --purple:#302B63;
    --gold:#FFC93C; --gold-soft:#FFE9A8; --coral:#FF6B6B; --green:#4ADE80;
    --ink:#F3F1FF; --ink-dim:#B9B4E0;
    --font-display:'Baloo 2','Segoe UI',system-ui,sans-serif;
    --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--font-body);
    background:radial-gradient(ellipse at top, var(--navy-mid), var(--navy-deep) 70%);
    color:var(--ink);
    padding: max(20px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
  }
  .wrap{ max-width: 640px; margin: 0 auto; }
  .back-link{ display:inline-block; font-size:13px; color:var(--ink-dim); text-decoration:none; margin-bottom:20px; }
  h1{ font-family:var(--font-display); font-weight:800; font-size:clamp(24px,5vw,32px); margin:0 0 6px; }
  .sub{ color:var(--ink-dim); font-size:15px; margin:0 0 28px; }

  .slots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:28px; }
  .slot-btn{
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15);
    color:var(--ink); border-radius:12px; padding:12px 10px; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:13.5px; text-align:center;
  }
  .slot-btn:hover{ border-color:var(--gold); background:rgba(255,201,60,.08); }
  .slot-btn.selected{ background:var(--gold); color:var(--navy-deep); border-color:var(--gold); }

  .form-card{
    background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:26px; margin-top:10px;
  }
  label{ display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px; font-weight:700; }
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04); color:var(--ink); font-family:var(--font-body); font-size:14.5px;
    margin-bottom:16px;
  }
  input::placeholder{ color:var(--ink-dim); }

  .submit-btn{
    width:100%; border:none; cursor:pointer; font-family:var(--font-display); font-weight:700;
    font-size:16px; color:var(--navy-deep); background:linear-gradient(135deg,var(--gold),#FF9F43);
    padding:15px; border-radius:14px; box-shadow:0 8px 20px rgba(255,159,67,.3);
  }
  .submit-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .status-msg{ text-align:center; padding:14px; border-radius:12px; margin-top:16px; font-size:14px; }
  .status-msg.error{ background:rgba(255,107,107,.12); color:#FFB3B3; border:1px solid rgba(255,107,107,.3); }
  .status-msg.success{ background:rgba(74,222,128,.12); color:var(--green); border:1px solid rgba(74,222,128,.3); }

  .empty-note{ text-align:center; color:var(--ink-dim); padding:30px; border:1px dashed rgba(255,255,255,.15); border-radius:16px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="choose-tutor.html">← Choose a different tutor</a>
    <h1>Pick a Time</h1>
    <p class="sub" id="tutor-name-sub">Free 15-minute placement call</p>

    <div id="slots-container"><div class="empty-note">Loading available times…</div></div>

    <div class="form-card" id="booking-form" style="display:none;">
      <label for="child-name">Child's name</label>
      <input type="text" id="child-name" placeholder="e.g. Alex">

      <label for="parent-email">Your email</label>
      <input type="email" id="parent-email" placeholder="you@example.com">

      <button class="submit-btn" id="submit-btn" disabled>Select a time above first</button>
      <div id="status-msg"></div>
    </div>
  </div>

  <script>
    // ---- CONFIGURATION — fill these in ----
    const SUPABASE_URL = "https://bfivpvlzehtmksnmgnzb.supabase.co"; // from your existing project
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";          // safe to expose publicly, NOT the service role key
    // ----------------------------------------

    const params = new URLSearchParams(window.location.search);
    const tutorId = params.get('tutor_id');       // pass ?tutor_id=... from choose-tutor.html
    const sessionType = params.get('type') || 'placement';
    // For a real logged-in flow, replace these with the actual signed-in parent/child IDs
    // (from your existing Supabase auth session and child_profiles selector).
    const parentId = params.get('parent_id') || null;
    const childId = params.get('child_id') || null;

    let selectedSlot = null;

    async function loadSlots() {
      if (!tutorId) {
        document.getElementById('slots-container').innerHTML =
          '<div class="empty-note">No tutor selected. Go back and choose a tutor first.</div>';
        return;
      }
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/tutor_availability?tutor_id=eq.${tutorId}&is_booked=eq.false&session_type=eq.${sessionType}&order=slot_start.asc`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      const slots = await res.json();
      const container = document.getElementById('slots-container');

      if (!Array.isArray(slots) || slots.length === 0) {
        container.innerHTML = '<div class="empty-note">No open times right now — check back soon!</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'slots';
      slots.forEach(slot => {
        const btn = document.createElement('button');
        btn.className = 'slot-btn';
        const start = new Date(slot.slot_start);
        btn.textContent = start.toLocaleString(undefined, {
          weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
        });
        btn.onclick = () => {
          document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedSlot = slot;
          document.getElementById('booking-form').style.display = 'block';
          updateSubmitState();
        };
        grid.appendChild(btn);
      });
      container.innerHTML = '';
      container.appendChild(grid);
    }

    function updateSubmitState() {
      const name = document.getElementById('child-name').value.trim();
      const email = document.getElementById('parent-email').value.trim();
      const btn = document.getElementById('submit-btn');
      const ready = selectedSlot && name && email;
      btn.disabled = !ready;
      btn.textContent = ready ? 'Confirm Booking →' : (selectedSlot ? 'Fill in details above' : 'Select a time above first');
    }

    document.getElementById('child-name').addEventListener('input', updateSubmitState);
    document.getElementById('parent-email').addEventListener('input', updateSubmitState);

    document.getElementById('submit-btn').addEventListener('click', async () => {
      const statusEl = document.getElementById('status-msg');
      statusEl.innerHTML = '';
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Booking…';

      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/create-booking`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
          body: JSON.stringify({
            availability_id: selectedSlot.id,
            tutor_id: tutorId,
            child_id: childId || crypto.randomUUID(), // placeholder if not wired to real auth yet
            parent_id: parentId || crypto.randomUUID(),
            parent_email: document.getElementById('parent-email').value.trim(),
            child_name: document.getElementById('child-name').value.trim(),
            session_type: sessionType,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.innerHTML = `<div class="status-msg error">${data.error || 'Something went wrong. Please try another time.'}</div>`;
          btn.disabled = false;
          btn.textContent = 'Confirm Booking →';
          loadSlots(); // refresh in case the slot was taken
          return;
        }

        statusEl.innerHTML = `<div class="status-msg success">You're booked! Check your email for the video call link.</div>`;
        document.getElementById('booking-form').style.display = 'none';
      } catch (err) {
        statusEl.innerHTML = `<div class="status-msg error">Network error — please try again.</div>`;
        btn.disabled = false;
        btn.textContent = 'Confirm Booking →';
      }
    });

    loadSlots();
  </script>
</body>
</html>
